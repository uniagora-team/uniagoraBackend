  /api/v1/categories/:
    get:
      operationId: categories_list
      summary: Browse the active category tree (customer-facing).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: string
        description: Filter children by parent category slug. Pass 'null' (or leave
          empty) to list root categories.
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
