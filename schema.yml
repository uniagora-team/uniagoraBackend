openapi: 3.0.3
info:
  title: UniAGORA API
  version: 1.0.0
  description: UniAGORA marketplace REST API.
paths:
  /api/v1/admin/categories/:
    get:
      operationId: admin_categories_list
      parameters:
      - in: query
        name: parent
        schema:
          type: string
        description: Filter categories by parent category slug. Pass 'null' to list
          only root categories; omit to return all categories.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryListResponse'
          description: ''
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Failure envelope for all 4xx responses (validation, authentication,
            authorization, business-rule conflicts).
    post:
      operationId: admin_categories_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCategoryWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCategoryWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryCreatedResponse'
          description: ''
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Failure envelope for all 4xx responses (validation, authentication,
            authorization, business-rule conflicts).
