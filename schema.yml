      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryUpdateResponse'
          description: ''
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Failure envelope for all 4xx responses (validation, authentication,
            authorization, business-rule conflicts).
    delete:
      operationId: admin_categories_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Failure envelope for all 4xx responses (validation, authentication,
            authorization, business-rule conflicts).
