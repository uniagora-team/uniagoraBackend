        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: condition
        schema:
          enum:
          - NEW
          - USED
          type: string
          minLength: 1
        description: |-
          * `NEW` - New
          * `USED` - Used
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      - in: query
        name: ordering
        schema:
          enum:
          - newest
          - price_asc
          - price_desc
          type: string
          minLength: 1
        description: |-
          * `newest` - Newest
          * `price_asc` - Lowest Price
          * `price_desc` - Highest Price
